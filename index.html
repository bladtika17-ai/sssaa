<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MyOS 6.5 FULL</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;user-select:none;}
body{overflow:hidden;background:black;}

/* LOGIN */
#login{
position:absolute;width:100vw;height:100vh;
background:#0a0a0a;color:white;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
}

/* DESKTOP */
#desktop{
display:none;
width:100vw;height:100vh;
position:relative;
overflow:hidden;
}

#bgVideo{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* TASKBAR */
#taskbar{
position:absolute;
bottom:0;
width:100%;
height:55px;
background:rgba(20,20,20,.6);
backdrop-filter:blur(20px);
display:flex;
align-items:center;
padding:0 10px;
}

.task-btn{
width:40px;height:40px;
margin:5px;
border-radius:10px;
background:rgba(255,255,255,.1);
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

#clock{margin-left:auto;color:white;padding-right:10px;}

/* START */
#start{
position:absolute;
bottom:65px;
left:10px;
width:300px;
background:rgba(0,0,0,.75);
backdrop-filter:blur(20px);
border-radius:15px;
display:none;
padding:10px;
color:white;
}

.app{
padding:10px;
border-radius:10px;
cursor:pointer;
}
.app:hover{background:rgba(255,255,255,.15);}

/* WINDOWS */
.window{
position:absolute;
width:420px;
height:300px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(20px);
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
display:none;
overflow:hidden;
}

.titlebar{
background:#1e1e1e;
color:white;
padding:8px;
display:flex;
justify-content:space-between;
cursor:move;
}

textarea{width:100%;height:240px}

/* FILES */
ul{padding:10px}

/* INPUT */
input,button{
padding:6px;
margin:2px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h1>MyOS 6.5</h1>
<button onclick="login()">Enter</button>
</div>

<!-- DESKTOP -->
<div id="desktop">

<video id="bgVideo" autoplay loop muted></video>

<!-- TASKBAR -->
<div id="taskbar">
<div class="task-btn" onclick="toggleStart()">🏠</div>
<div id="clock"></div>
</div>

<!-- START -->
<div id="start">
<input id="search" oninput="searchApps()" placeholder="Search..." style="width:100%">

<div class="app" onclick="openApp('browser')">🌐 Browser</div>
<div class="app" onclick="openApp('notepad')">📄 Notepad</div>
<div class="app" onclick="openApp('calc')">🧮 Calculator</div>
<div class="app" onclick="openApp('files')">📁 Files</div>
<div class="app" onclick="openApp('gallery')">🖼 Gallery</div>
<div class="app" onclick="openApp('settings')">⚙ Settings</div>
</div>

<!-- BROWSER -->
<div class="window" id="browser">
<div class="titlebar" onmousedown="drag(event,'browser')">
Browser <button onclick="closeApp('browser')">X</button>
</div>
<input id="url" style="width:100%">
<button onclick="go()">Go</button>
<iframe id="frame" style="width:100%;height:240px"></iframe>
</div>

<!-- NOTEPAD -->
<div class="window" id="notepad">
<div class="titlebar" onmousedown="drag(event,'notepad')">
Notepad <button onclick="closeApp('notepad')">X</button>
</div>
<textarea id="note" oninput="save()"></textarea>
</div>

<!-- CALC -->
<div class="window" id="calc">
<div class="titlebar" onmousedown="drag(event,'calc')">
Calc <button onclick="closeApp('calc')">X</button>
</div>
<input id="c">
<button onclick="add('+')">+</button>
<button onclick="add('-')">-</button>
<button onclick="res()">=</button>
</div>

<!-- FILES -->
<div class="window" id="files">
<div class="titlebar" onmousedown="drag(event,'files')">
Files <button onclick="closeApp('files')">X</button>
</div>
<input id="fname">
<button onclick="addFile()">Create</button>
<ul id="list"></ul>
</div>

<!-- GALLERY -->
<div class="window" id="gallery">
<div class="titlebar" onmousedown="drag(event,'gallery')">
Gallery <button onclick="closeApp('gallery')">X</button>
</div>
<input type="file" multiple onchange="wall(this)">
<div id="gal"></div>
</div>

<!-- SETTINGS -->
<div class="window" id="settings">
<div class="titlebar" onmousedown="drag(event,'settings')">
Settings <button onclick="closeApp('settings')">X</button>
</div>
<input type="file" accept="image/*,video/*" onchange="wall(this)">
</div>

</div>

<script>

/* LOGIN */
function login(){
document.getElementById("login").style.display="none";
document.getElementById("desktop").style.display="block";
}

/* CLOCK */
setInterval(()=>{
document.getElementById("clock").innerText=new Date().toLocaleTimeString();
},1000);

/* START */
function toggleStart(){
let s=document.getElementById("start");
s.style.display=s.style.display==="block"?"none":"block";
}

/* APPS */
function openApp(id){document.getElementById(id).style.display="block";}
function closeApp(id){document.getElementById(id).style.display="none";}

/* DRAG */
function drag(e,id){
let w=document.getElementById(id);
let ox=e.clientX-w.offsetLeft;
let oy=e.clientY-w.offsetTop;

document.onmousemove=(e)=>{
w.style.left=(e.clientX-ox)+"px";
w.style.top=(e.clientY-oy)+"px";
};
document.onmouseup=()=>document.onmousemove=null;
}

/* BROWSER */
function go(){
let u=document.getElementById("url").value;
if(!u.startsWith("http"))u="https://"+u;
document.getElementById("frame").src=u;
}

/* NOTEPAD */
function save(){
localStorage.setItem("n",document.getElementById("note").value);
}
window.onload=()=>{
document.getElementById("note").value=localStorage.getItem("n")||"";
loadFiles();
}

/* CALC */
let v="";
function add(x){v+=x;document.getElementById("c").value=v;}
function res(){v=eval(v);document.getElementById("c").value=v;}

/* FILES */
let f=[];
function addFile(){
f.push(document.getElementById("fname").value);
render();
}
function render(){
let l=document.getElementById("list");
l.innerHTML="";
f.forEach((x,i)=>{
l.innerHTML+=`<li>${x} <button onclick="f.splice(${i},1);render()">del</button></li>`;
});
}

/* WALLPAPER */
function wall(e){
let file=e.files[0];
let url=URL.createObjectURL(file);

if(file.type.startsWith("video")){
document.getElementById("bgVideo").src=url;
}else{
document.body.style.backgroundImage=`url(${url})`;
}
}

/* SEARCH */
function searchApps(){
let q=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".app").forEach(a=>{
a.style.display=a.innerText.toLowerCase().includes(q)?"block":"none";
});
}

</script>

</body>
</html>
