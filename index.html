<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Chat 🌲</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#08110d;
overflow:hidden;
color:white;
}

/* GLASS */
.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff89d6,#ffb3f0);
z-index:10;
}

.loginBox{
width:340px;
padding:25px;
border-radius:25px;
}

.loginBox h1{
text-align:center;
margin-bottom:20px;
color:white;
}

input{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:14px;
outline:none;
background:rgba(255,255,255,0.15);
color:white;
}

input::placeholder{
color:#eee;
}

button{
width:100%;
padding:13px;
margin-top:14px;
border:none;
border-radius:14px;
background:#16a34a;
color:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
}

/* APP */
#app{
display:none;
height:100vh;
}

/* TOP */
#top{
height:75px;
display:flex;
align-items:center;
justify-content:space-between;
padding:15px;
border-bottom:1px solid rgba(255,255,255,0.08);
}

#logo{
font-size:28px;
font-weight:bold;
background:linear-gradient(90deg,#00ff88,#00ffaa,#00ff88);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:glow 3s infinite linear;
}

@keyframes glow{
0%{filter:hue-rotate(0deg)}
100%{filter:hue-rotate(360deg)}
}

#changingText{
font-size:14px;
opacity:.8;
animation:fade 4s infinite;
}

@keyframes fade{
0%{opacity:0}
20%{opacity:1}
80%{opacity:1}
100%{opacity:0}
}

/* POSTS */
#feed{
height:calc(100vh - 170px);
overflow:auto;
padding:15px;
}

.post{
padding:15px;
margin-bottom:15px;
border-radius:22px;
}

.post img,
.post video{
width:100%;
border-radius:18px;
margin-top:10px;
}

.postTop{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.name{
font-weight:bold;
}

.location{
font-size:13px;
opacity:0.8;
margin-top:4px;
}

/* CHAT */
#bottom{
height:95px;
padding:10px;
display:flex;
gap:10px;
align-items:center;
}

#message{
flex:1;
height:50px;
}

/* WELCOME */
#welcome{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
background:rgba(255,182,255,0.2);
backdrop-filter:blur(25px);
z-index:50;
opacity:0;
pointer-events:none;
transition:1s;
}

#welcome.show{
opacity:1;
}

/* TIMER */
#timer{
position:fixed;
top:90px;
right:20px;
padding:12px 18px;
border-radius:20px;
display:none;
}

/* FOLLOW BTN */
.followBtn{
background:#00cc66;
margin-top:10px;
}

/* LIKE */
.likeBtn{
margin-top:10px;
background:#ff4081;
}

</style>
</head>

<body>

<div id="welcome">
Добрый день 🌸
</div>

<!-- LOGIN -->
<div id="login">

<div class="loginBox glass">

<h1>Nature Chat 🌲</h1>

<input id="nick" placeholder="Введите ник">

<input type="file" id="avatar" accept="image/*">

<button onclick="enter()">Войти</button>

</div>

</div>

<!-- APP -->
<div id="app">

<div id="top" class="glass">

<div id="logo">🌲 Nature Chat</div>

<div id="changingText">
You can post a photo in Nature
</div>

</div>

<div id="feed"></div>

<div id="bottom" class="glass">

<input id="message" placeholder="📍 Введите локацию и сообщение">

<input type="file" id="media" accept="image/*,video/*">

<button onclick="createPost()">POST</button>

</div>

</div>

<div id="timer" class="glass"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

/* FIREBASE */
firebase.initializeApp({
apiKey:"AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
authDomain:"gartic-game.firebaseapp.com",
databaseURL:"https://gartic-game-default-rtdb.firebaseio.com",
projectId:"gartic-game",
storageBucket:"gartic-game.firebasestorage.app",
messagingSenderId:"990895566694",
appId:"1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
});

const db=firebase.database();

let currentUser=null;
let lastPost=0;

/* LOGIN */
function enter(){

let nick=document.getElementById("nick").value;
let avatar=document.getElementById("avatar").files[0];

if(!nick) return alert("Введите ник");

let reader=new FileReader();

reader.onload=function(){

let data={
nick:nick,
avatar:reader.result
};

localStorage.setItem("natureUser",JSON.stringify(data));

start(data);

}

if(avatar){
reader.readAsDataURL(avatar);
}else{
reader.onload();
}

}

/* AUTO LOGIN */
let saved=localStorage.getItem("natureUser");

if(saved){
start(JSON.parse(saved));
}

/* START */
function start(user){

currentUser=user;

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

let w=document.getElementById("welcome");

w.innerHTML="Добрый день, "+user.nick+" 🌸";

w.classList.add("show");

setTimeout(()=>{
w.classList.remove("show");
},3000);

loadPosts();

}

/* POSTS */
function createPost(){

let now=Date.now();

if(now-lastPost<20000){

let remain=Math.ceil((20000-(now-lastPost))/1000);

let t=document.getElementById("timer");

t.style.display="block";

t.innerHTML="Подождите "+remain+" сек";

return;
}

let text=document.getElementById("message").value;

if(!text.includes("📍")){
text="📍 "+text;
}

let file=document.getElementById("media").files[0];

if(!file) return alert("Выберите фото или видео");

let reader=new FileReader();

reader.onload=function(){

db.ref("posts").push({

nick:currentUser.nick,
avatar:currentUser.avatar,
text:text,
media:reader.result,
type:file.type,
likes:0,
time:Date.now()

});

document.getElementById("message").value="";
document.getElementById("media").value="";

lastPost=Date.now();

}

reader.readAsDataURL(file);

}

/* LOAD */
function loadPosts(){

db.ref("posts").on("child_added",snap=>{

let p=snap.val();

let div=document.createElement("div");

div.className="post glass";

let mediaHTML="";

if(p.type.startsWith("image")){
mediaHTML=`<img src="${p.media}">`;
}else{
mediaHTML=`<video controls src="${p.media}"></video>`;
}

div.innerHTML=`

<div class="postTop">

<img class="avatar" src="${p.avatar || 'https://i.imgur.com/2DhmtJ4.png'}">

<div>
<div class="name">${p.nick}</div>
<div class="location">${p.text}</div>
</div>

</div>

${mediaHTML}

<button class="likeBtn">❤️ Like</button>

<button class="followBtn">➕ Follow</button>

`;

let likeBtn=div.querySelector(".likeBtn");

likeBtn.onclick=()=>{

if(localStorage.getItem("liked_"+snap.key)) return;

localStorage.setItem("liked_"+snap.key,true);

likeBtn.innerHTML="💖 Liked";

confetti();

};

let followBtn=div.querySelector(".followBtn");

followBtn.onclick=()=>{

if(localStorage.getItem("follow_"+p.nick)) return;

localStorage.setItem("follow_"+p.nick,true);
