<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartic Ultra Edition</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --accent-color: #c5a059;
            --text-color: #ff0055;
            --neon-blue: #00f2fe;
            --light-text: #fff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--light-text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        #lobby, #game {
            display: none;
            width: 100%;
            max-width: 950px;
        }

        .active { display: block !important; }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 10px var(--text-color), 0 0 20px var(--text-color); transform: scale(1); }
            50% { text-shadow: 0 0 25px #ff66aa, 0 0 40px var(--text-color); transform: scale(1.03); }
            100% { text-shadow: 0 0 10px var(--text-color), 0 0 20px var(--text-color); transform: scale(1); }
        }

        .drawer-status {
            font-size: 26px;
            color: var(--text-color);
            text-align: center;
            font-weight: 900;
            letter-spacing: 1px;
            animation: neonPulse 2.5s infinite ease-in-out;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .game-container {
            display: grid;
            grid-template-columns: 220px 1fr 280px;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .game-container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        #canvas-container {
            position: relative;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            height: 460px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .tools {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tools button {
            background: #2f3640;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tools button:hover {
            background: #444f5e;
        }

        .tools button.active-tool {
            background: var(--text-color);
            box-shadow: 0 0 15px var(--text-color);
        }

        @keyframes sprayGlow {
            0% { box-shadow: 0 0 5px var(--neon-blue); }
            50% { box-shadow: 0 0 20px var(--neon-blue); }
            100% { box-shadow: 0 0 5px var(--neon-blue); }
        }
        .tools button#tool-spray.active-tool {
            background: var(--neon-blue);
            animation: sprayGlow 1.5s infinite ease-in-out;
            color: #000;
        }

        #timer {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0,255,136,0.3);
            font-family: monospace;
        }

        #timer.warning { 
            color: var(--text-color); 
            text-shadow: 0 0 15px var(--text-color);
            animation: neonPulse 0.6s infinite; 
        }

        input, button.main-btn {
            padding: 14px;
            border-radius: 10px;
            border: none;
            margin-top: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input { 
            width: calc(100% - 28px); 
            background: #2f3640; 
            color: #fff; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        input:focus {
            outline: none;
            border-color: var(--text-color);
            box-shadow: 0 0 10px rgba(255,0,85,0.3);
        }

        button.main-btn { 
            background: var(--text-color); 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button.main-btn:hover { 
            opacity: 0.9; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,0,85,0.4);
        }

        .chat-messages {
            height: 310px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-messages div {
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.02);
            word-break: break-all;
        }

        .system-msg { color: #fbc531; font-style: italic; background: rgba(251, 197, 49, 0.05) !important; }
        .correct-msg { 
            color: #00ff88; 
            font-weight: bold; 
            background: rgba(0, 255, 136, 0.1) !important;
            border: 1px solid rgba(0, 255, 136, 0.2);
            text-shadow: 0 0 5px rgba(0,255,136,0.3);
        }
        
        .player-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="lobby" class="active">
        <h1 style="text-align: center; color: var(--text-color); font-size: 36px; text-shadow: 0 0 15px rgba(255,0,85,0.3);">Gartic Ultra Edition</h1>
        <div class="panel" style="max-width: 400px; margin: 0 auto; text-align: center;">
            <p style="color: #8d99ae;">Введите никнейм для мгновенной игры:</p>
            <input type="text" id="username" placeholder="Ваш ник..." maxlength="15">
            <button class="main-btn" onclick="joinGame()" style="width: 100%;">Войти и играть сразу</button>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game">
        <div id="status-line" class="drawer-status">Загрузка игры...</div>
        <div id="timer">120</div>

        <div class="game-container">
            <div class="panel">
                <h3 style="color: var(--neon-blue); margin-top: 0;">Онлайн игроки</h3>
                <div id="players-list"></div>
                <div id="round-number" style="margin-top: 25px; font-weight: bold; color: #8d99ae;">Раунд: 1/3</div>
            </div>

            <div id="canvas-container">
                <canvas id="paintCanvas" width="500" height="450"></canvas>
                <div class="tools" id="drawer-tools" style="display: none;">
                    <button id="tool-pencil" class="active-tool" onclick="setTool('pencil')">✏️ Карандаш</button>
                    <button id="tool-spray" onclick="setTool('spray')">💨 Баллончик</button>
                    <button onclick="clearCanvas()" style="background: #ea2027;">🗑️ Очистить</button>
                </div>
            </div>

            <div class="panel" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <h3 style="color: #fbc531; margin-top: 0;">Ответы / Чат</h3>
                    <div id="chat" class="chat-messages"></div>
                </div>
                <div id="guess-zone">
                    <input type="text" id="guess-input" placeholder="Введите слово..." onkeypress="handleChatKey(event)">
                    <button class="main-btn" onclick="sendGuess()" style="width: 100%; margin-top: 8px;">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ТВОЙ РАБОЧИЙ КОНФИГ FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "gartic-game",
            storageBucket: "gartic-game.firebasestorage.app",
            messagingSenderId: "990895566694",
            appId: "1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = '';
        let myName = '';
        let currentRole = 'guesser'; 
        let currentTool = 'pencil'; 
        let isDrawing = false;
        const wordsList = ['яблоко', 'машина', 'кошка', 'солнце', 'дерево', 'дом', 'телефон', 'самолет', 'банан', 'пицца', 'арбуз', 'бургер', 'гитара'];

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        function joinGame() {
            const inputField = document.getElementById('username');
            const enteredName = inputField.value.trim();
            if(!enteredName) return alert('Введите имя!');
            
            myName = enteredName;
            myId = '_' + Math.random().toString(36).substr(2, 9);

            db.ref('players/' + myId).set({
                name: myName,
                score: 0,
                id: myId
            });

            db.ref('players/' + myId).onDisconnect().remove();

            document.getElementById('lobby').classList.remove('active');
            document.getElementById('game').classList.add('active');

            initGameSync();
        }

        function initGameSync() {
            db.ref('players').on('value', snapshot => {
                const playersObj = snapshot.val() || {};
                const listDiv = document.getElementById('players-list');
                listDiv.innerHTML = '';
                
                const playersArray = Object.values(playersObj);
                playersArray.forEach(p => {
                    listDiv.innerHTML += `<div class="player-item"><span>👤 <b>${p.name}</b></span> <span style="color:#00ff88">${p.score} б.</span></div>`;
                });

                db.ref('gameState/status').once('value', statusSnap => {
                    if (!statusSnap.val() || statusSnap.val() === 'waiting') {
                        if (playersArray.length > 0 && playersArray[0].id === myId) { 
                            startNewRound(1, playersArray);
                        }
                    }
                });
            });

            db.ref('gameState').on('value', snapshot => {
                const state = snapshot.val();
                if (!state) return;

                document.getElementById('round-number').innerText = `Раунд: ${state.currentRound}/3`;

                if (state.status === 'drawing') {
                    if (state.drawerId === myId) {
                        currentRole = 'drawer';
                        document.getElementById('status-line').innerHTML = `🎨 ВАШ ХОД! Рисуйте слово: <span style="color:#fff; text-decoration: underline;">${state.currentWord.toUpperCase()}</span>`;
                        document.getElementById('drawer-tools').style.display = 'flex';
                        document.getElementById('guess-zone').style.display = 'none';
                    } else {
                        currentRole = 'guesser';
                        document.getElementById('status-line').innerText = `🤔 Угадайте, что рисуют на экране!`;
                        document.getElementById('drawer-tools').style.display = 'none';
                        document.getElementById('guess-zone').style.display = 'block';
                    }
                } else if (state.status === 'results') {
                    showFinalResults();
                }
            });

            db.ref('gameState/timer').on('value', snapshot => {
                const time = snapshot.val() || 0;
                const timerEl = document.getElementById('timer');
                timerEl.innerText = time;
                if(time <= 10) timerEl.classList.add('warning');
                else timerEl.classList.remove('warning');

                if (currentRole === 'drawer' && time > 0 && window.timerInterval === undefined) {
                    window.timerInterval = setInterval(() => {
                        db.ref('gameState/timer').set(time - 1);
                        clearInterval(window.timerInterval);
                        window.timerInterval = undefined;
                    }, 1000);
                }

                if (time === 0 && currentRole === 'drawer') {
                    checkRoundEnd();
                }
            });

            db.ref('canvas/lines').on('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                if (currentRole === 'guesser') {
                    drawFromFirebase(data.x, data.y, data.type, data.isNew);
                }
            });

            db.ref('chat').on('child_added', snapshot => {
                const msg = snapshot.val();
                const chatDiv = document.getElementById('chat');
                let className = '';
                if(msg.type === 'system') className = 'system-msg';
                if(msg.type === 'correct') className = 'correct-msg';

                chatDiv.innerHTML += `<div class="${className}"><b>${msg.user}:</b> ${msg.text}</div>`;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            });
        }

        function startNewRound(roundNum, playersArray) {
            if (!playersArray || playersArray.length === 0) return;
            
            if (roundNum > 3) {
                db.ref('gameState').update({ status: 'results' });
                return;
            }

            const drawerIndex = (roundNum - 1) % playersArray.length;
            const drawer = playersArray[drawerIndex];
            const randomWord = wordsList[Math.floor(Math.random() * wordsList.length)];

            db.ref('canvas').remove();
            db.ref('chat').remove();

            db.ref('gameState').set({
                status: 'drawing',
                currentRound: roundNum,
                currentWord: randomWord,
                drawerId: drawer.id,
                timer: 120
            });

            sendSystemMessage(`Раунд ${roundNum} начался!`);
        }

        function checkRoundEnd() {
            db.ref('players').once('value', snap => {
                const players = Object.values(snap.val() || {});
                db.ref('gameState/currentRound').once('value', rSnap => {
                    startNewRound(rSnap.val() + 1, players);
                });
            });
        }

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('tool-pencil').classList.toggle('active-tool', tool === 'pencil');
            document.getElementById('tool-spray').classList.toggle('active-tool', tool === 'spray');
        }

        canvas.addEventListener('mousedown', (e) => {
            if (currentRole !== 'drawer') return;
            isDrawing = true;
            sendDrawData(e, true);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || currentRole !== 'drawer') return;
            sendDrawData(e, false);
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        function sendDrawData(e, isNew) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            db.ref('canvas/lines').set({ x: x, y: y, type: currentTool, isNew: isNew });
            drawFromFirebase(x, y, currentTool, isNew);
        }

        let lastX, lastY;
        function drawFromFirebase(x, y, type, isNew) {
            if (isNew) {
                lastX = x;
                lastY = y;
            }

            if (type === 'pencil') {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else if (type === 'spray') {
                ctx.fillStyle = '#000';
                for (let i = 0; i < 12; i++) {
                    const radius = 10;
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * radius;
                    const offsetX = Math.cos(angle) * r;
                    const offsetY = Math.sin(angle) * r;
                    ctx.fillRect(x + offsetX, y + offsetY, 2, 2);
                }
            }
            lastX = x;
            lastY = y;
        }

        function clearCanvas() {
            if (currentRole !== 'drawer') return;
            db.ref('canvas').remove();
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendGuess(); }

        function sendGuess() {
            const input = document.getElementById('guess-input');
            const text = input.value.trim().toLowerCase();
            if (!text) return;

            db.ref('gameState/currentWord').once('value', snapshot => {
                const correctWord = snapshot.val().toLowerCase();

                if (text === correctWord) {
                    db.ref(`players/${myId}/score`).transaction(score => (score || 0) + 1);
                    db.ref('chat').push({ user: 'Система', text: `🎉 ${myName} угадал слово (${correctWord})!`, type: 'correct' });
                    checkRoundEnd();
                } else {
                    db.ref('chat').push({ user: myName, text: text, type: 'normal' });
                }
            });
            input.value = '';
        }

        function sendSystemMessage(text) {
            db.ref('chat').push({ user: 'Система', text: text, type: 'system' });
        }

        function showFinalResults() {
            db.ref('players').once('value', snapshot => {
                const players = Object.values(snapshot.val() || {});
                players.sort((a,b) => b.score - a.score);

                let winnerText = '🏆 ИТОГИ ИГРЫ:\n';
                players.forEach((p, idx) => {
                    winnerText += `${idx + 1}. ${p.name} — ${p.score} очков\n`;
                });
                winnerText += '\nНажмите ОК, чтобы начать заново.';

                alert(winnerText);

                if (players.length > 0 && players[0].id === myId) {
                    players.forEach(p => db.ref(`players/${p.id}/score`).set(0));
                    startNewRound(1, players);
                }
            });
        }
    </script>
</body>
</html>
