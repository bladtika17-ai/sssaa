<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Gartic</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial;
    background:#0f1722;
    color:white;
}

/* ФОН */

#animated-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-1;
}

.wave{
    position:absolute;
    width:200%;
    height:200%;
    background:radial-gradient(circle at center,
    rgba(0,140,255,0.25),
    rgba(0,0,0,0));
    animation:waveMove 8s linear infinite;
}

.wave:nth-child(2){
    animation-duration:12s;
    opacity:0.7;
}

.wave:nth-child(3){
    animation-duration:16s;
    opacity:0.4;
}

@keyframes waveMove{
    0%{
        transform:translate(-20%,-20%) rotate(0deg);
    }
    100%{
        transform:translate(-20%,-20%) rotate(360deg);
    }
}

/* MENU */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.menu-box{
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:20px;
    width:320px;
    box-shadow:0 0 30px rgba(0,140,255,0.4);
}

.menu-box h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    background:#008cff;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#game{
    display:none;
    height:100vh;
}

#topbar{
    height:70px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px;
}

#role-info{
    font-size:20px;
    font-weight:bold;
}

#game-area{
    display:flex;
    height:calc(100vh - 70px);
}

#players{
    width:220px;
    background:rgba(0,0,0,0.35);
    overflow:auto;
    padding:10px;
}

#players-list div{
    margin-top:10px;
    background:rgba(255,255,255,0.05);
    padding:10px;
    border-radius:10px;
}

#canvas-container{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

canvas{
    background:white;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

#chat-container{
    width:300px;
    background:rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
    padding:10px;
}

#chat{
    flex:1;
    overflow:auto;
}

.chat-msg{
    background:rgba(255,255,255,0.08);
    margin-top:10px;
    padding:10px;
    border-radius:10px;
}

.system-msg{
    background:#214b9b;
}

.correct-msg{
    background:#1f8a3c;
}

#drawer-panel{
    margin-top:15px;
    width:400px;
}

.active-tool{
    background:orange;
}

#word-display{
    font-size:22px;
    margin-top:10px;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="animated-bg">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
</div>

<div id="menu">

    <div class="menu-box">

        <h1>🎨 Mini Gartic</h1>

        <input
            type="text"
            id="nickname"
            placeholder="Введите ник"
        >

        <button onclick="joinGame()">
            Войти в игру
        </button>

    </div>

</div>

<div id="game">

    <div id="topbar">

        <div>

            <button id="tool-pencil"
            onclick="setTool('pencil')"
            class="active-tool">
                ✏ Карандаш
            </button>

            <button id="tool-spray"
            onclick="setTool('spray')">
                💨 Спрей
            </button>

            <button onclick="clearCanvas()">
                🗑 Очистить
            </button>

            <button onclick="forceStartRound()">
                ▶ Старт
            </button>

        </div>

        <div id="role-info">
            Роль: зритель
        </div>

    </div>

    <div id="game-area">

        <div id="players">

            <h2>Игроки</h2>

            <div id="players-list"></div>

        </div>

        <div id="canvas-container">

            <canvas
                id="canvas"
                width="800"
                height="500">
            </canvas>

            <div id="word-display"></div>

            <div id="drawer-panel"
            style="display:none;">

                <input
                    type="text"
                    id="secret-word-input"
                    placeholder="Введите слово"
                >

                <button onclick="submitSecretWord()">
                    Начать рисовать
                </button>

            </div>

        </div>

        <div id="chat-container">

            <div id="chat"></div>

            <input
                type="text"
                id="guess-input"
                placeholder="Ваш ответ"
                onkeydown="handleChatKey(event)"
            >

            <button onclick="sendGuess()">
                Отправить
            </button>

        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

/* JOIN */

function joinGame(){

    const name =
    document.getElementById('nickname')
    .value.trim();

    if(!name){
        alert('Введите ник');
        return;
    }

    myName = name;

    myId = db.ref().push().key;

    db.ref('players/' + myId).set({
        id:myId,
        name:myName,
        score:0
    });

    document.getElementById('menu')
    .style.display = 'none';

    document.getElementById('game')
    .style.display = 'block';

    setupListeners();
}
