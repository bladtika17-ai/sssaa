<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gartic Neon PRO</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:#050816;
    color:white;
}

/* BACKGROUND */
#bg{
    position:fixed;
    inset:0;
    z-index:-3;
}

/* WAVE */
#wave{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:0%;
    background:linear-gradient(180deg,#1e90ff,#0033ff);
    opacity:0.6;
    transition:1.2s;
    z-index:5;
}
#wave.active{height:100%;}

/* MENU */
#menu{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.box{
    width:320px;
    padding:30px;
    border-radius:20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(12px);
    position:relative;
    overflow:hidden;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
}

/* GAME */
#game{display:none;}

#top{
    height:60px;
    background:rgba(0,0,0,0.4);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
}

#main{
    display:flex;
    height:calc(100vh - 60px);
}

#players{
    width:200px;
    background:rgba(0,0,0,0.3);
    padding:10px;
}

#center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

canvas{
    background:white;
    border-radius:12px;
    cursor:crosshair;
}

#chat{
    width:260px;
    background:rgba(0,0,0,0.3);
    padding:10px;
}

.msg{
    margin:5px;
    padding:6px;
    background:rgba(255,255,255,0.08);
    border-radius:8px;
}

/* WORD INPUT */
#wordBox{
    display:none;
    margin-top:10px;
}

.rainDot{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:radial-gradient(circle,red,orange,yellow,green,blue);
    animation:up 1.5s linear forwards;
}

@keyframes up{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-200px);opacity:0;}
}
</style>
</head>

<div id="wave"></div>

    </div>

        <div id="players"></div>

        <div id="center">

            <div id="wordBox">
                <input id="wordInput" placeholder="Слово">
                <button onclick="setWord()">OK</button>
            </div>
        </div>

        <div id="chat"></div>

    </div>

</div>

/* JOIN EFFECT */
function rain(){
    let box=document.getElementById("box");
    for(let i=0;i<20;i++){
        let d=document.createElement("div");
        d.className="rainDot";
        d.style.left=Math.random()*300+"px";
        d.style.top="200px";
        box.appendChild(d);
        setTimeout(()=>d.remove(),1500);
    }
}

/* JOIN */
function join(){

    rain();

    document.getElementById("wave").classList.add("active");

    setTimeout(()=>{

        myName=document.getElementById("nick").value;

        myId=db.ref("players").push().key;

        db.ref("players/"+myId).set({
            name:myName,
            score:0
        });

        document.getElementById("menu").style.display="none";
        document.getElementById("game").style.display="block";

        listen();

    },1200);
}

/* LISTEN */
function listen(){

    db.ref("players").on("value",snap=>{
        let p=snap.val()||{};
        document.getElementById("players").innerHTML=
        Object.values(p).map(x=>"👤 "+x.name).join("<br>");
    });

    db.ref("chat").on("child_added",snap=>{
        let m=snap.val();
        document.getElementById("chat").innerHTML+=
        `<div class="msg">${m.user}: ${m.text}</div>`;
    });

    db.ref("game").on("value",snap=>{
        let g=snap.val();
        if(!g)return;

        drawer=(g.drawer===myId);
        word=g.word;

        document.getElementById("role").innerText=
        drawer?"🎨 Рисуешь":"👀 Угадываешь";

        document.getElementById("wordBox").style.display=
        (drawer && g.status==="setup")?"block":"none";
    });
}

/* START */
function startGame(){

    db.ref("players").once("value",snap=>{
        let arr=Object.keys(snap.val()||{});
        if(arr.length===0)return;

        let d=arr[Math.floor(Math.random()*arr.length)];

        db.ref("game").set({
            drawer:d,
            word:"",
            status:"setup"
        });

        startTimer();
    });
}

/* WORD */
function setWord(){

    let w=document.getElementById("wordInput").value.toLowerCase();
    if(!w)return;

    db.ref("game").update({
        word:w,
        status:"play"
    });

    document.getElementById("wordBox").style.display="none";
}

/* TIMER */
function startTimer(){
    clearInterval(interval);
    time=120;

    interval=setInterval(()=>{
        time--;
        document.getElementById("timer").innerText=time;

        if(time<=0){
            clearInterval(interval);
            db.ref("chat").push({
                user:"SYSTEM",
                text:"⏰ Раунд закончился"
            });
        }
    },1000);
}
