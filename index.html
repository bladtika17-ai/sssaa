<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gartic FIX CORE</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:#050816;
    color:white;
}

/* BACKGROUND DOTS */
#bg{
    position:fixed;
    inset:0;
    z-index:-2;
}

/* WAVE */
#wave{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:0%;
    background:linear-gradient(180deg,#2563eb,#1d4ed8);
    opacity:0.7;
    transition:1.2s;
    z-index:5;
}
#wave.active{height:100%;}

/* MENU */
#menu{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.box{
    width:300px;
    padding:25px;
    background:rgba(0,0,0,0.6);
    border-radius:20px;
    backdrop-filter:blur(10px);
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

/* GAME */
#game{
    display:none;
}

#top{
    height:60px;
    background:rgba(0,0,0,0.4);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
}

#main{
    display:flex;
    height:calc(100vh - 60px);
}

#players{
    width:200px;
    background:rgba(0,0,0,0.3);
    padding:10px;
}

#center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

canvas{
    background:white;
    border-radius:12px;
}

/* particles on join */
.particle{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:radial-gradient(circle,red,orange,yellow,green,blue);
    animation:up 1.5s linear forwards;
}

@keyframes up{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-200px);opacity:0;}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div id="wave"></div>

<div id="menu">
    <div class="box" id="box">
        <h2>🎨 Gartic FIX</h2>
        <input id="nick" placeholder="Ник">
        <button onclick="join()">Войти в игру</button>
    </div>
</div>

<div id="game">

    <div id="top">
        <div id="role">...</div>
        <button onclick="startGame()">Старт</button>
    </div>

    <div id="main">
        <div id="players"></div>

        <div id="center">
            <canvas id="c" width="650" height="420"></canvas>
        </div>

        <div id="chat"></div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

/* FIREBASE */
firebase.initializeApp({
apiKey:"AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
authDomain:"gartic-game.firebaseapp.com",
databaseURL:"https://gartic-game-default-rtdb.firebaseio.com",
projectId:"gartic-game",
storageBucket:"gartic-game.firebasestorage.app",
messagingSenderId:"990895566694",
appId:"1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
});

const db=firebase.database();

let myId="";
let myName="";

/* DOT BACKGROUND (REAL WORKING) */
const bg=document.getElementById("bg");
const ctx=bg.getContext("2d");

function resize(){
    bg.width=window.innerWidth;
    bg.height=window.innerHeight;
}
resize();
window.onresize=resize;

let dots=[];

for(let i=0;i<70;i++){
    dots.push({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        vx:(Math.random()-0.5)*1,
        vy:(Math.random()-0.5)*1
    });
}

document.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
});

let mouse={x:0,y:0};

function animate(){
    ctx.clearRect(0,0,bg.width,bg.height);

    for(let d of dots){
        d.x+=d.vx;
        d.y+=d.vy;

        if(d.x<0||d.x>bg.width) d.vx*=-1;
        if(d.y<0||d.y>bg.height) d.vy*=-1;

        ctx.fillStyle="#60a5fa";
        ctx.beginPath();
        ctx.arc(d.x,d.y,2,0,Math.PI*2);
        ctx.fill();

        let dx=d.x-mouse.x;
        let dy=d.y-mouse.y;
        let dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<120){
            ctx.strokeStyle="rgba(96,165,250,0.3)";
            ctx.beginPath();
            ctx.moveTo(d.x,d.y);
            ctx.lineTo(mouse.x,mouse.y);
            ctx.stroke();
        }
    }

    requestAnimationFrame(animate);
}
animate();

/* PARTICLES */
function spawnParticles(){
    let box=document.getElementById("box");

    for(let i=0;i<20;i++){
        let p=document.createElement("div");
        p.className="particle";
        p.style.left=Math.random()*300+"px";
        p.style.top="200px";
        box.appendChild(p);
        setTimeout(()=>p.remove(),1500);
    }
}

/* JOIN (FIXED) */
function join(){

    const name=document.getElementById("nick").value.trim();
    if(!name) return alert("введи ник");

    spawnParticles();

    document.getElementById("wave").classList.add("active");

    setTimeout(()=>{

        myName=name;
        myId=db.ref("players").push().key;

        db.ref("players/"+myId).set({
            name:myName,
            score:0
        }).then(()=>{

            document.getElementById("menu").style.display="none";
            document.getElementById("game").style.display="block";

            listen();

        });

    },1200);
}

/* LISTEN */
function listen(){

    db.ref("players").on("value",snap=>{
        let p=snap.val()||{};
        document.getElementById("players").innerHTML=
        Object.values(p).map(x=>"👤 "+x.name).join("<br>");
    });

    db.ref("chat").on("child_added",snap=>{
        let m=snap.val();
        document.getElementById("chat").innerHTML+=
        `<div>${m.user}: ${m.text}</div>`;
    });

}

/* START */
function startGame(){
    db.ref("chat").push({
        user:"SYSTEM",
        text:"🎮 Game started"
    });
}

/* DRAW */
const c=document.getElementById("c");
const cctx=c.getContext("2d");

let draw=false;

c.addEventListener("mousedown",e=>{
    draw=true;
});

c.addEventListener("mouseup",()=>draw=false);

c.addEventListener("mousemove",e=>{
    if(!draw)return;

    let r=c.getBoundingClientRect();
    let x=e.clientX-r.left;
    let y=e.clientY-r.top;

    cctx.fillRect(x,y,3,3);
});

</script>

</body>
</html>
