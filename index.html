<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Chat 🌲</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
color:white;
height:100vh;

/* 🌲 ЗЕЛЁНЫЙ ФОН */
background:
linear-gradient(to top,
#14532d 0%,
#166534 25%,
#15803d 45%,
#052e16 100%);
}

/* ТРАВА */
body::before{
content:"";
position:fixed;
bottom:0;
left:0;
width:100%;
height:180px;

background:
radial-gradient(circle at 10% 100%, #22c55e 0 30px, transparent 31px),
radial-gradient(circle at 20% 100%, #16a34a 0 35px, transparent 36px),
radial-gradient(circle at 30% 100%, #22c55e 0 28px, transparent 29px),
radial-gradient(circle at 40% 100%, #15803d 0 40px, transparent 41px),
radial-gradient(circle at 50% 100%, #22c55e 0 32px, transparent 33px),
radial-gradient(circle at 60% 100%, #16a34a 0 36px, transparent 37px),
radial-gradient(circle at 70% 100%, #22c55e 0 30px, transparent 31px),
radial-gradient(circle at 80% 100%, #15803d 0 42px, transparent 43px),
radial-gradient(circle at 90% 100%, #22c55e 0 35px, transparent 36px);

opacity:0.7;
pointer-events:none;
}

/* GLASS */
.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
}

.loginBox{
width:340px;
padding:25px;
border-radius:30px;
}

/* TITLE */
.title{
font-size:38px;
text-align:center;
margin-bottom:20px;
font-weight:bold;

background:linear-gradient(90deg,#00ff88,#00ffaa,#00ff88);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:glow 3s linear infinite;
}

@keyframes glow{
0%{filter:hue-rotate(0deg)}
100%{filter:hue-rotate(360deg)}
}

input{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:16px;
background:rgba(255,255,255,0.12);
color:white;
outline:none;
}

input::placeholder{
color:#ddd;
}

button{
width:100%;
padding:14px;
margin-top:14px;
border:none;
border-radius:16px;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.03);
}

/* APP */
#app{
display:none;
height:100vh;
}

/* TOP */
#top{
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border-bottom:1px solid rgba(255,255,255,0.1);
}

#logo{
font-size:28px;
font-weight:bold;
background:linear-gradient(90deg,#00ff88,#00ffaa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#changingText{
font-size:14px;
opacity:.9;
}

/* FEED */
#feed{
height:calc(100vh - 170px);
overflow:auto;
padding:15px;
}

/* POST */
.post{
padding:15px;
border-radius:24px;
margin-bottom:15px;
}

.post img,
.post video{
width:100%;
border-radius:20px;
margin-top:10px;
}

.postTop{
display:flex;
gap:10px;
align-items:center;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.name{
font-weight:bold;
}

.location{
font-size:13px;
opacity:.8;
}

/* BOTTOM */
#bottom{
height:90px;
display:flex;
gap:10px;
padding:10px;
}

#message{
flex:1;
}

/* WELCOME */
#welcome{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
backdrop-filter:blur(25px);
background:rgba(0,255,120,0.15);
opacity:0;
pointer-events:none;
transition:1s;
z-index:50;
}

#welcome.show{
opacity:1;
}

</style>
</head>

<body>

<div id="welcome">
Добрый день 🌸
</div>

<!-- LOGIN -->
<div id="login">

<div class="loginBox glass">

<div class="title">🌲 Nature Chat</div>

<input id="nick" placeholder="Введите ник">

<input type="file" id="avatar" accept="image/*">

<button onclick="enter()">Войти</button>

</div>

</div>

<!-- APP -->
<div id="app">

<div id="top" class="glass">

<div id="logo">🌲 Nature Chat</div>

<div id="changingText">
You can post a photo in Nature 🌿
</div>

</div>

<div id="feed"></div>

<div id="bottom" class="glass">

<input id="message" placeholder="📍 Локация и сообщение">

<input type="file" id="media" accept="image/*,video/*">

<button onclick="createPost()">POST</button>

</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

/* FIREBASE */
firebase.initializeApp({
apiKey:"AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
authDomain:"gartic-game.firebaseapp.com",
databaseURL:"https://gartic-game-default-rtdb.firebaseio.com",
projectId:"gartic-game",
storageBucket:"gartic-game.firebasestorage.app",
messagingSenderId:"990895566694",
appId:"1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
});

const db = firebase.database();

let currentUser=null;

/* ENTER */
function enter(){

let nick=document.getElementById("nick").value.trim();

if(!nick){
alert("Введите ник");
return;
}

let avatarFile=document.getElementById("avatar").files[0];

if(avatarFile){

let reader=new FileReader();

reader.onload=function(e){

saveUser({
nick:nick,
avatar:e.target.result
});

};

reader.readAsDataURL(avatarFile);

}else{

saveUser({
nick:nick,
avatar:"https://i.imgur.com/2DhmtJ4.png"
});

}

}

/* SAVE USER */
function saveUser(user){

localStorage.setItem(
"natureUser",
JSON.stringify(user)
);

start(user);

}

/* AUTO LOGIN */
let saved=localStorage.getItem("natureUser");

if(saved){

start(JSON.parse(saved));

}

/* START */
function start(user){

currentUser=user;

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

let welcome=document.getElementById("welcome");

welcome.innerHTML=
"Добрый день, "+user.nick+" 🌸";

welcome.classList.add("show");

setTimeout(()=>{
welcome.classList.remove("show");
},3000);

loadPosts();

}

/* CREATE POST */
function createPost(){

let message=
document.getElementById("message").value;

let file=
document.getElementById("media").files[0];

if(!file){
alert("Выберите фото или видео");
return;
}

let reader=new FileReader();

reader.onload=function(e){

db.ref("posts").push({

nick:currentUser.nick,
avatar:currentUser.avatar,
message:message,
media:e.target.result,
type:file.type

});

};

reader.readAsDataURL(file);

}

/* LOAD POSTS */
function loadPosts(){

db.ref("posts").on("child_added",snap=>{

let p=snap.val();

let div=document.createElement("div");

div.className="post glass";

let media="";

if(p.type.startsWith("image")){

media=`<img src="${p.media}">`;

}else{

media=`<video controls src="${p.media}"></video>`;

}

div.innerHTML=`

<div class="postTop">

<img class="avatar" src="${p.avatar}">

<div>
<div class="name">${p.nick}</div>
<div class="location">${p.message}</div>
</div>

</div>

${media}

`;

document.getElementById("feed")
.prepend(div);

});

}

"Nature community o
