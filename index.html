<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartic Firebase Game</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #e94560;
            --light-text: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--light-text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #lobby, #game {
            display: none;
            width: 100%;
            max-width: 900px;
        }

        .active { display: block !important; }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px #e94560; }
            50% { transform: scale(1.05); text-shadow: 0 0 25px #ff6b81; }
            100% { transform: scale(1); text-shadow: 0 0 10px #e94560; }
        }

        .drawer-status {
            font-size: 24px;
            color: var(--text-color);
            text-align: center;
            font-weight: bold;
            animation: pulse 2s infinite ease-in-out;
            margin-bottom: 15px;
        }

        .game-container {
            display: grid;
            grid-template-columns: 200px 1fr 250px;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .game-container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-color);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        #canvas-container {
            position: relative;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            height: 450px;
        }

        canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .tools {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
        }

        .tools button {
            background: var(--text-color);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .tools button.active-tool {
            background: #fff;
            color: #000;
        }

        #timer {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            color: #4cd137;
        }

        #timer.warning { color: #e94560; animation: pulse 0.5s infinite; }

        input, button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-top: 10px;
            font-size: 16px;
        }

        input { width: calc(100% - 24px); background: #fff; color: #000; }
        button { background: var(--text-color); color: white; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }

        .chat-messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .system-msg { color: #fbc531; font-style: italic; }
        .correct-msg { color: #4cd137; font-weight: bold; }
    </style>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="lobby" class="active">
        <h1 style="text-align: center; color: var(--text-color);">Gartic Firebase Edition</h1>
        <div class="panel" style="max-width: 400px; margin: 0 auto; text-align: center;">
            <p>Введите ваше имя для игры (Нужно 2 человека в сети):</p>
            <input type="text" id="username" placeholder="Никнейм..." maxlength="15">
            <button onclick="joinGame()" style="width: 100%;">Войти в игру</button>
            <p id="lobby-status" style="margin-top:15px; color: #fbc531;"></p>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game">
        <div id="status-line" class="drawer-status">Ожидание игроков...</div>
        <div id="timer">120</div>

        <div class="game-container">
            <div class="panel">
                <h3>Игроки</h3>
                <div id="players-list"></div>
                <div id="round-number" style="margin-top: 20px; font-weight: bold;">Раунд: 1/3</div>
            </div>

            <div id="canvas-container">
                <canvas id="paintCanvas" width="500" height="450"></canvas>
                <div class="tools" id="drawer-tools" style="display: none;">
                    <button id="tool-pencil" class="active-tool" onclick="setTool('pencil')">✏️ Карандаш</button>
                    <button id="tool-spray" onclick="setTool('spray')">💨 Баллончик</button>
                    <button onclick="clearCanvas()">🗑️ Очистить</button>
                </div>
            </div>

            <div class="panel" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <h3>Чат / Ответы</h3>
                    <div id="chat" class="chat-messages"></div>
                </div>
                <div id="guess-zone">
                    <input type="text" id="guess-input" placeholder="Ваш ответ..." onkeypress="handleChatKey(event)">
                    <button onclick="sendGuess()" style="width: 100%;">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. НАСТРОЙКА FIREBASE (ТВОИ ДАННЫЕ) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
            authDomain: "gartic-game.firebaseapp.com",
            databaseURL: "https://gartic-game-default-rtdb.firebaseio.com",
            projectId: "gartic-game",
            storageBucket: "gartic-game.firebasestorage.app",
            messagingSenderId: "990895566694",
            appId: "1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = '';
        let myName = '';
        let isDrawing = false;
        let currentRole = 'guesser'; 
        let currentTool = 'pencil'; 
        const wordsList = ['яблоко', 'машина', 'кошка', 'солнце', 'дерево', 'дом', 'телефон', 'самолет', 'банан', 'пицца'];

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        function joinGame() {
            const input = document.getElementById('username').value.trim();
            if(!input) return alert('Введите имя!');
            myName = input;
            myId = '_' + Math.random().toString(36).substr(2, 9);

            db.ref('players/' + myId).set({
                name: myName,
                score: 0,
                id: myId
            });

            db.ref('players/' + myId).onDisconnect().remove();

            document.getElementById('lobby').classList.remove('active');
            document.getElementById('game').classList.add('active');

            initGameSync();
        }

        function initGameSync() {
            db.ref('players').on('value', snapshot => {
                const players = snapshot.val() || {};
                const listDiv = document.getElementById('players-list');
                listDiv.innerHTML = '';
                
                const playersArray = Object.values(players);
                playersArray.forEach(p => {
                    listDiv.innerHTML += `<div>👤 <b>${p.name}</b>: ${p.score} очков</div>`;
                });

                db.ref('gameState/status').once('value', statusSnap => {
                    if (playersArray.length >= 2 && (!statusSnap.val() || statusSnap.val() === 'waiting')) {
                        if (playersArray[0].id === myId) { 
                            startNewRound(1, playersArray);
                        }
                    }
                });
            });

            db.ref('gameState').on('value', snapshot => {
                const state = snapshot.val();
                if (!state) return;

                document.getElementById('round-number').innerText = `Раунд: ${state.currentRound}/3`;

                if (state.status === 'drawing') {
                    if (state.drawerId === myId) {
                        currentRole = 'drawer';
                        document.getElementById('status-line').innerHTML = `🎨 ВАШ ХОД! КРАСИВО РИСУЙТЕ: <span style="color:#fff">${state.currentWord.toUpperCase()}</span>`;
                        document.getElementById('drawer-tools').style.display = 'flex';
                        document.getElementById('guess-zone').style.display = 'none';
                    } else {
                        currentRole = 'guesser';
                        document.getElementById('status-line').innerText = `🤔 Кто-то рисует... Угадайте слово!`;
                        document.getElementById('drawer-tools').style.display = 'none';
                        document.getElementById('guess-zone').style.display = 'block';
                    }
                } else if (state.status === 'results') {
                    showFinalResults();
                }
            });

            db.ref('gameState/timer').on('value', snapshot => {
                const time = snapshot.val() || 0;
                const timerEl = document.getElementById('timer');
                timerEl.innerText = time;
                if(time <= 10) timerEl.classList.add('warning');
                else timerEl.classList.remove('warning');

                if (currentRole === 'drawer' && time > 0 && window.timerInterval === undefined) {
                    window.timerInterval = setInterval(() => {
                        db.ref('gameState/timer').set(time - 1);
                        clearInterval(window.timerInterval);
                        window.timerInterval = undefined;
                    }, 1000);
                }

                if (time === 0 && currentRole === 'drawer') {
                    checkRoundEnd();
                }
            });

            db.ref('canvas/lines').on('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                if (currentRole === 'guesser') {
                    drawFromFirebase(data.x, data.y, data.type, data.isNew);
                }
            });

            db.ref('chat').on('child_added', snapshot => {
                const msg = snapshot.val();
                const chatDiv = document.getElementById('chat');
                let className = '';
                if(msg.type === 'system') className = 'system-msg';
                if(msg.type === 'correct') className = 'correct-msg';

                chatDiv.innerHTML += `<div class="${className}"><b>${msg.user}:</b> ${msg.text}</div>`;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            });
        }

        function startNewRound(roundNum, playersArray) {
            if (!playersArray || playersArray.length === 0) return;
            
            if (roundNum > 3) {
                db.ref('gameState').update({ status: 'results' });
                return;
            }

            const drawerIndex = (roundNum - 1) % playersArray.length;
            const drawer = playersArray[drawerIndex];
            const randomWord = wordsList[Math.floor(Math.random() * wordsList.length)];

            db.ref('canvas').remove();
            db.ref('chat').remove();

            db.ref('gameState').set({
                status: 'drawing',
                currentRound: roundNum,
                currentWord: randomWord,
                drawerId: drawer.id,
                timer: 120
            });

            sendSystemMessage(`Раунд ${roundNum} начался!`);
        }

        function checkRoundEnd() {
            db.ref('players').once('value', snap => {
                const players = Object.values(snap.val() || {});
                db.ref('gameState/currentRound').once('value', rSnap => {
                    startNewRound(rSnap.val() + 1, players);
                });
            });
        }

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('tool-pencil').classList.toggle('active-tool', tool === 'pencil');
            document.getElementById('tool-spray').classList.toggle('active-tool', tool === 'spray');
        }

        canvas.addEventListener('mousedown', (e) => {
            if (currentRole !== 'drawer') return;
            isDrawing = true;
            sendDrawData(e, true);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || currentRole !== 'drawer') return;
            sendDrawData(e, false);
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        function sendDrawData(e, isNew) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            db.ref('canvas/lines').set({ x: x, y: y, type: currentTool, isNew: isNew });
            drawFromFirebase(x, y, currentTool, isNew);
        }

        let lastX, lastY;
        function drawFromFirebase(x, y, type, isNew) {
            if (isNew) {
                lastX = x;
                lastY = y;
            }

            if (type === 'pencil') {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else if (type === 'spray') {
                ctx.fillStyle = '#000';
                for (let i = 0; i < 10; i++) {
                    const offset = getRandomOffset(12);
                    ctx.fillRect(x + offset.x, y + offset.y, 2, 2);
                }
            }
            lastX = x;
            lastY = y;
        }

        function getRandomOffset(radius) {
            const r = Math.random() * radius;
            const angle = Math.random() * Math.PI * 2;
            return { x: Math.cos(angle) * r, y: Math.sin(angle) * r };
        }

        function clearCanvas() {
            if (currentRole !== 'drawer') return;
            db.ref('canvas').remove();
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendGuess(); }

        function sendGuess() {
            const input = document.getElementById('guess-input');
            const text = input.value.trim().toLowerCase();
            if (!text) return;

            db.ref('gameState/currentWord').once('value', snapshot => {
                const correctWord = snapshot.val().toLowerCase();

                if (text === correctWord) {
                    db.ref(`players/${myId}/score`).transaction(score => (score || 0) + 1);
                    db.ref('chat').push({ user: 'Система', text: `🎉 ${myName} угадал слово (${correctWord})!`, type: 'correct' });
                    checkRoundEnd();
                } else {
                    db.ref('chat').push({ user: myName, text: text, type: 'normal' });
                }
            });
            input.value = '';
        }

        function sendSystemMessage(text) {
            db.ref('chat').push({ user: 'Система', text: text, type: 'system' });
        }

        function showFinalResults() {
            db.ref('players').once('value', snapshot => {
                const players = Object.values(snapshot.val() || {});
                players.sort((a,b) => b.score - a.score);

                let winnerText = '🏆 ИТОГИ ИГРЫ:\n';
                players.forEach((p, idx) => {
                    winnerText += `${idx + 1}. ${p.name} — ${p.score} очков\n`;
                });
                winnerText += '\nНажмите ОК, чтобы начать заново.';

                alert(winnerText);

                if (players.length > 0 && players[0].id === myId) {
                    players.forEach(p => db.ref(`players/${p.id}/score`).set(0));
                    startNewRound(1, players);
                }
            });
        }
    </script>
</body>
</html>
