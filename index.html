<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Gartic FIX</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111827;
    color:white;
    overflow:hidden;
}

#menu{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:rgba(0,0,0,0.5);
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:none;
}

button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

#game{
    display:none;
    height:100vh;
}

#top{
    height:60px;
    background:#1f2937;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
}

#main{
    display:flex;
    height:calc(100vh - 60px);
}

#players{
    width:200px;
    background:#111827;
    padding:10px;
    overflow:auto;
}

#chat{
    width:250px;
    background:#111827;
    padding:10px;
    overflow:auto;
}

#center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

canvas{
    background:white;
    border-radius:10px;
}

.msg{
    margin:5px 0;
    padding:5px;
    background:#1f2937;
    border-radius:8px;
}
</style>
</head>

<body>

<div id="menu">
    <div class="box">
        <h2>🎨 Gartic FIX</h2>
        <input id="nick" placeholder="Ник">
        <button onclick="join()">Войти</button>
    </div>
</div>

<div id="game">

    <div id="top">
        <div id="role">Загрузка...</div>
        <button onclick="startGame()">Старт</button>
    </div>

    <div id="main">

        <div id="players"></div>

        <div id="center">
            <canvas id="c" width="600" height="400"></canvas>
            <input id="word" placeholder="Слово (для художника)" style="display:none;">
            <button onclick="sendWord()" id="sendWordBtn" style="display:none;">OK</button>
        </div>

        <div id="chat"></div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
    authDomain: "gartic-game.firebaseapp.com",
    databaseURL: "https://gartic-game-default-rtdb.firebaseio.com",
    projectId: "gartic-game",
    storageBucket: "gartic-game.firebasestorage.app",
    messagingSenderId: "990895566694",
    appId: "1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myId = null;
let myName = "";
let isDrawer = false;

function join(){

    const n = document.getElementById("nick").value.trim();
    if(!n) return alert("введи ник");

    myName = n;
    myId = db.ref("players").push().key;

    db.ref("players/" + myId).set({
        name: myName,
        score: 0
    });

    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";

    listen();
}

function listen(){

    db.ref("players").on("value", snap=>{
        const p = snap.val() || {};
        document.getElementById("players").innerHTML =
            Object.values(p).map(x => `<div>${x.name} (${x.score})</div>`).join("");
    });

    db.ref("game").on("value", snap=>{
        const g = snap.val();
        if(!g) return;

        isDrawer = g.drawer === myId;

        document.getElementById("role").innerText =
            isDrawer ? "🎨 Ты рисуешь" : "👀 Ты угадываешь";

        if(isDrawer){
            document.getElementById("word").style.display = "block";
            document.getElementById("sendWordBtn").style.display = "block";
        } else {
            document.getElementById("word").style.display = "none";
            document.getElementById("sendWordBtn").style.display = "none";
        }
    });

}

function startGame(){

    db.ref("players").once("value", snap=>{
        const arr = Object.keys(snap.val() || {});
        if(arr.length === 0) return;

        const drawer = arr[Math.floor(Math.random()*arr.length)];

        db.ref("game").set({
            drawer: drawer,
            word: "",
            status: "setup"
        });
    });

}

function sendWord(){

    const w = document.getElementById("word").value.trim().toLowerCase();
    if(!w) return;

    db.ref("game").update({
        word: w,
        status: "play"
    });

}

</script>

</body>
</html>
