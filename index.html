<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Gartic</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#1e1e1e;
    color:white;
    text-align:center;
}

#menu{
    margin-top:100px;
}

input{
    padding:10px;
    border:none;
    border-radius:10px;
    width:220px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:5px;
    font-size:16px;
}

#game{
    display:none;
}

#topbar{
    background:#2c2c2c;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#players{
    width:200px;
    background:#2a2a2a;
    height:500px;
    overflow:auto;
    padding:10px;
}

#chat{
    width:250px;
    background:#2a2a2a;
    height:500px;
    overflow:auto;
    padding:10px;
}

#canvas-container{
    flex:1;
}

#game-area{
    display:flex;
    gap:10px;
    padding:10px;
}

canvas{
    background:white;
    border-radius:10px;
    cursor:crosshair;
}

.chat-msg{
    margin:5px;
    padding:5px;
    border-radius:5px;
    background:#3a3a3a;
}

.system-msg{
    background:#4444aa;
}

.correct-msg{
    background:#22aa22;
}

.active-tool{
    background:orange;
}
</style>
</head>

<body>

<div id="menu">
    <h1>🎨 Mini Gartic</h1>

    <input type="text" id="nickname" placeholder="Введите ник">

    <br><br>

    <button onclick="joinGame()">
        Войти в игру
    </button>
</div>

<div id="game">

    <div id="topbar">

        <div>
            <button id="tool-pencil" onclick="setTool('pencil')" class="active-tool">
                ✏ Карандаш
            </button>

            <button id="tool-spray" onclick="setTool('spray')">
                💨 Спрей
            </button>

            <button onclick="clearCanvas()">
                🗑 Очистить
            </button>

            <button onclick="forceStartRound()">
                ▶ Старт
            </button>
        </div>

        <div id="role-info">
            Роль: зритель
        </div>

    </div>

    <div id="game-area">

        <div id="players">
            <h3>Игроки</h3>

            <div id="players-list"></div>
        </div>

        <div id="canvas-container">

            <canvas id="canvas" width="800" height="500"></canvas>

            <br><br>

            <div id="drawer-panel" style="display:none;">
                <input type="text" id="secret-word-input" placeholder="Введите слово">
                <button onclick="submitSecretWord()">Подтвердить</button>
            </div>

        </div>

        <div>

            <div id="chat"></div>

            <br>

            <input
                type="text"
                id="guess-input"
                placeholder="Ваш ответ"
                onkeydown="handleChatKey(event)"
            >

            <button onclick="sendGuess()">
                Отправить
            </button>

        </div>

    </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
    authDomain: "gartic-game.firebaseapp.com",
    databaseURL: "https://gartic-game-default-rtdb.firebaseio.com",
    projectId: "gartic-game",
    storageBucket: "gartic-game.firebasestorage.app",
    messagingSenderId: "990895566694",
    appId: "1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let myId = '';
let myName = '';

let currentRole = 'viewer';
let currentTool = 'pencil';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let isDrawing = false;
let lastX = 0;
let lastY = 0;

function joinGame(){
    const input = document.getElementById('nickname');
    const name = input.value.trim();

    if(!name){
        alert('Введите ник');
        return;
    }

    myName = name;
    myId = db.ref().push().key;

    db.ref('players/' + myId).set({
        id: myId,
        name: myName,
        score: 0
    });

    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').style.display = 'block';

    setupFirebaseListeners();
}

function setupFirebaseListeners(){
    db.ref('players').on('value', snapshot => {
        const players = snapshot.val() || {};
        updatePlayers(players);
    });

    db.ref('chat').on('child_added', snapshot => {
        const msg = snapshot.val();
        addChatMessage(msg);
    });

    db.ref('canvas/lines').on('child_added', snapshot => {
        const data = snapshot.val();
        drawFromFirebase(
            data.x,
            data.y,
            data.type,
            data.isNew
        );
    });

    db.ref('canvas').on('value', snapshot => {
        if(!snapshot.exists()){
            ctx.clearRect(0,0,canvas.width,canvas.height);
        }
    });

    db.ref('gameState').on('value', snapshot => {
        const state = snapshot.val();
        if(!state) return;

        if(state.drawerId === myId){
            currentRole = 'drawer';
            document.getElementById('role-info').innerText = 'Роль: художник';

            if(state.status === 'setup'){
                document.getElementById('drawer-panel').style.display = 'block';
            }else{
                document.getElementById('drawer-panel').style.display = 'none';
            }
        }else{
            currentRole = 'viewer';
            document.getElementById('role-info').innerText = 'Роль: угадывающий';
            document.getElementById('drawer-panel').style.display = 'none';
        }
    });
}

function updatePlayers(players){
    const list = document.getElementById('players-list');
    list.innerHTML = '';

    Object.values(players).forEach(player => {
        list.innerHTML += `
            <div>
                👤 ${player.name} — ${player.score}
            </div>
        `;
    });
}

function addChatMessage(msg){
    const chat = document.getElementById('chat');
    let className = 'chat-msg';

    if(msg.type === 'system')
        className = 'system-msg';

    if(msg.type === 'correct')
        className = 'correct-msg';

    chat.innerHTML += `
        <div class="${className}">
            <b>${msg.user}:</b> ${msg.text}
        </div>
    `;

    chat.scrollTop = chat.scrollHeight;
}

function forceStartRound(){
    db.ref('players').once('value', snapshot => {
        const arr = Object.values(snapshot.val() || {});
        if(arr.length > 0){
            setupNewTurn(1, arr);
        }
    });
}

function setupNewTurn(roundNum, playersArray){
    if(roundNum > 3){
        showFinalResults();
        return;
    }
    // Логика переключения раундов
}
</script>

</body>
</html>
