<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartic Instant Paint</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --text-color: #ff0055;
            --neon-blue: #00f2fe;
            --light-text: #fff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--light-text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            height: 100vh;
            box-sizing: border-box;
        }

        /* КРАСИВАЯ АНИМАЦИЯ НАПЛЫВА КРАСКИ ПРИ ВХОДЕ */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .paint-stripe {
            width: 100%;
            height: 20%;
            transform: translateX(-100%);
            animation: splashIn 0.8s forwards ease-out;
        }

        .stripe-1 { background: #ff0055; animation-delay: 0.1s; }
        .stripe-2 { background: #00f2fe; animation-delay: 0.2s; }
        .stripe-3 { background: #fbc531; animation-delay: 0.3s; }
        .stripe-4 { background: #9c27b0; animation-delay: 0.4s; }
        /* Белый затекает последним и открывает холст */
        .stripe-white { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            transform: translateY(-100%);
            animation: slideWhite 1.2s forwards cubic-bezier(0.77, 0, 0.175, 1);
            animation-delay: 0.8s;
        }

        @keyframes splashIn {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }

        @keyframes slideWhite {
            0% { transform: translateY(-100%); }
            40% { transform: translateY(0); }
            100% { transform: translateY(100%); opacity: 0; display: none; }
        }

        /* ИНТЕРФЕЙС ИГРЫ */
        #game {
            width: 100%;
            max-width: 950px;
            animation: fadeInGame 1s forwards;
            animation-delay: 1.5s;
            opacity: 0;
        }

        @keyframes fadeInGame {
            to { opacity: 1; }
        }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 10px var(--text-color); transform: scale(1); }
            50% { text-shadow: 0 0 25px #ff66aa; transform: scale(1.02); }
            100% { text-shadow: 0 0 10px var(--text-color); transform: scale(1); }
        }

        .drawer-status {
            font-size: 26px;
            color: var(--text-color);
            text-align: center;
            font-weight: 900;
            letter-spacing: 1px;
            animation: neonPulse 2.5s infinite ease-in-out;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .game-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .panel {
            background: var(--panel-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        #canvas-container {
            position: relative;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            height: 500px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .tools {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tools button {
            background: #2f3640;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tools button:hover {
            background: #444f5e;
        }

        .tools button.active-tool {
            background: var(--text-color);
            box-shadow: 0 0 15px var(--text-color);
        }

        @keyframes sprayGlow {
            0% { box-shadow: 0 0 5px var(--neon-blue); }
            50% { box-shadow: 0 0 20px var(--neon-blue); }
            100% { box-shadow: 0 0 5px var(--neon-blue); }
        }
        .tools button#tool-spray.active-tool {
            background: var(--neon-blue);
            animation: sprayGlow 1.5s infinite ease-in-out;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- ЭФФЕКТ ЗАЛИВКИ КРАСКОЙ ПРИ ВХОДЕ -->
    <div id="intro-overlay">
        <div class="paint-stripe stripe-1"></div>
        <div class="paint-stripe stripe-2"></div>
        <div class="paint-stripe stripe-3"></div>
        <div class="paint-stripe stripe-4"></div>
        <div class="stripe-white"></div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН (ОТКРЫВАЕТСЯ СРАЗУ) -->
    <div id="game" class="active">
        <div id="status-line" class="drawer-status">🎨 Свободное рисование включено!</div>

        <div class="game-container">
            <div id="canvas-container">
                <canvas id="paintCanvas" width="800" height="500"></canvas>
                <div class="tools">
                    <button id="tool-pencil" class="active-tool" onclick="setTool('pencil')">✏️ Карандаш</button>
                    <button id="tool-spray" onclick="setTool('spray')">💨 Баллончик</button>
                    <button onclick="clearCanvas()" style="background: #ea2027;">🗑️ Очистить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isDrawing = false;
        let currentTool = 'pencil'; 
        let lastX = 0;
        let lastY = 0;

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        
        // Корректная настройка размеров холста под экран
        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
        }

        // Запуск настройки после анимации наплыва
        setTimeout(() => {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }, 1000);

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('tool-pencil').classList.toggle('active-tool', tool === 'pencil');
            document.getElementById('tool-spray').classList.toggle('active-tool', tool === 'spray');
        }

        // Логика рисования мышкой и пальцем
        canvas.addEventListener('mousedown', (e) => startDraw(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', (e) => moveDraw(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            startDraw(touch.clientX, touch.clientY);
        });
        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            moveDraw(touch.clientX, touch.clientY);
        });
        window.addEventListener('touchend', () => isDrawing = false);

        function startDraw(clientX, clientY) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = clientX - rect.left;
            lastY = clientY - rect.top;
            draw(lastX, lastY, true);
        }

        function moveDraw(clientX, clientY) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            draw(x, y, false);
        }

        function draw(x, y, isNew) {
            if (isNew) {
                lastX = x;
                lastY = y;
            }

            if (currentTool === 'pencil') {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else if (currentTool === 'spray') {
                ctx.fillStyle = '#000000';
                for (let i = 0; i < 12; i++) {
                    const radius = 10;
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * radius;
                    const offsetX = Math.cos(angle) * r;
                    const offsetY = Math.sin(angle) * r;
                    ctx.fillRect(x + offsetX, y + offsetY, 2, 2);
                }
            }
            lastX = x;
            lastY = y;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
