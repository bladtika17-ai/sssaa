<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Chat 🌲</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
overflow:hidden;
color:white;
background:linear-gradient(to top,#052e16,#166534,#14532d);
}

/* ТРАВА */
body::before{
content:"";
position:fixed;
bottom:0;
left:0;
width:100%;
height:180px;
background:
radial-gradient(circle at 10% 100%, #22c55e 0 30px, transparent 31px),
radial-gradient(circle at 20% 100%, #16a34a 0 35px, transparent 36px),
radial-gradient(circle at 30% 100%, #22c55e 0 28px, transparent 29px),
radial-gradient(circle at 40% 100%, #15803d 0 40px, transparent 41px),
radial-gradient(circle at 50% 100%, #22c55e 0 32px, transparent 33px),
radial-gradient(circle at 60% 100%, #16a34a 0 36px, transparent 37px),
radial-gradient(circle at 70% 100%, #22c55e 0 30px, transparent 31px),
radial-gradient(circle at 80% 100%, #15803d 0 42px, transparent 43px),
radial-gradient(circle at 90% 100%, #22c55e 0 35px, transparent 36px);
opacity:.7;
pointer-events:none;
}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
}

.box{
width:340px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
}

.title{
font-size:32px;
text-align:center;
margin-bottom:15px;
color:#00ff88;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
}

button{
background:#22c55e;
color:white;
cursor:pointer;
}

/* APP */
#app{
display:none;
height:100vh;
}

#top{
height:70px;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

#logo{
font-size:20px;
font-weight:bold;
color:#00ff88;
}

#feed{
height:calc(100vh - 150px);
overflow:auto;
padding:10px;
}

.post{
background:rgba(255,255,255,0.06);
padding:10px;
border-radius:15px;
margin-bottom:10px;
}

.post img,.post video{
width:100%;
border-radius:10px;
margin-top:10px;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
}

.topPost{
display:flex;
gap:10px;
align-items:center;
}

#bottom{
display:flex;
gap:10px;
padding:10px;
}

#bottom input{
flex:1;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<div class="title">🌲 Nature Chat</div>

<input id="nick" placeholder="Ник">
<input type="file" id="avatar">

<button id="loginBtn">Войти</button>
</div>
</div>

<!-- APP -->
<div id="app">

<div id="top">
<div id="logo">🌲 Nature Chat</div>
<div id="status">online</div>
</div>

<div id="feed"></div>

<div id="bottom">
<input id="msg" placeholder="Описание + место">
<input type="file" id="file">
<button id="postBtn">POST</button>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
firebase.initializeApp({
apiKey:"AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
authDomain:"gartic-game.firebaseapp.com",
databaseURL:"https://gartic-game-default-rtdb.firebaseio.com",
projectId:"gartic-game",
storageBucket:"gartic-game.appspot.com",
messagingSenderId:"990895566694",
appId:"1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
});

const db = firebase.database();

let currentUser = null;

/* LOGIN */
document.getElementById("loginBtn").onclick = () => {

let nick = document.getElementById("nick").value;
if(!nick) return alert("Введи ник");

let file = document.getElementById("avatar").files[0];

if(file){
let r = new FileReader();
r.onload = e => {
saveUser({nick, avatar:e.target.result});
};
r.readAsDataURL(file);
}else{
saveUser({nick, avatar:"https://i.imgur.com/2DhmtJ4.png"});
}

};

function saveUser(user){
localStorage.setItem("user", JSON.stringify(user));
start(user);
}

/* START */
function start(user){

currentUser = user;

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

/* GEO */
navigator.geolocation.getCurrentPosition(pos=>{
currentUser.lat = pos.coords.latitude;
currentUser.lng = pos.coords.longitude;

db.ref("users/"+currentUser.nick).set({
...currentUser,
online:true,
last:Date.now()
});
});

/* ONLINE PING */
setInterval(()=>{
if(!currentUser) return;

db.ref("users/"+currentUser.nick).update({
online:true,
last:Date.now()
});

},5000);

loadPosts();

}

/* POST */
document.getElementById("postBtn").onclick = () => {

let msg = document.getElementById("msg").value;
let file = document.getElementById("file").files[0];

if(!file) return alert("Добавь фото/видео");

let r = new FileReader();

r.onload = e => {

let id = db.ref("posts").push().key;

db.ref("posts/"+id).set({
id,
nick:currentUser.nick,
avatar:currentUser.avatar,
message:msg,
media:e.target.result,
type:file.type,
likes:0,
lat:currentUser.lat||null,
lng:currentUser.lng||null,
time:Date.now()
});

};

r.readAsDataURL(file);

};

/* LIKE */
function like(id){
db.ref("posts/"+id+"/likes").transaction(l=> (l||0)+1);
}
window.like = like;

/* LOAD */
function loadPosts(){

db.ref("posts").on("child_added",snap=>{

let p = snap.val();

let el = document.createElement("div");
el.className="post";

let media = p.type.startsWith("image")
? `<img src="${p.media}">`
: `<video controls src="${p.media}"></video>`;

el.innerHTML = `
<div class="topPost">
<img class="avatar" src="${p.avatar}">
<div>
<b>${p.nick}</b><br>
<small>${p.message}</small>
</div>
</div>

${media}

<button onclick="like('${p.id}')">❤️ ${p.likes||0}</button>
`;

document.getElementById("feed").prepend(el);

});

}

/* AUTO LOGIN */
let saved = localStorage.getItem("user");
if(saved) start(JSON.parse(saved));

</script>

</body>
</html>
