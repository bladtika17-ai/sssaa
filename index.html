<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartic Ultra Edition</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --accent-color: #c5a059;
            --text-color: #ff0055;
            --neon-blue: #00f2fe;
            --light-text: #fff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--light-text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        #lobby, #game {
            display: none;
            width: 100%;
            max-width: 950px;
        }

        .active { display: block !important; }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 10px var(--text-color), 0 0 20px var(--text-color); transform: scale(1); }
            50% { text-shadow: 0 0 25px #ff66aa, 0 0 40px var(--text-color); transform: scale(1.02); }
            100% { text-shadow: 0 0 10px var(--text-color), 0 0 20px var(--text-color); transform: scale(1); }
        }

        .drawer-status {
            font-size: 24px;
            color: var(--text-color);
            text-align: center;
            font-weight: 900;
            letter-spacing: 1px;
            animation: neonPulse 2.5s infinite ease-in-out;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .game-container {
            display: grid;
            grid-template-columns: 220px 1fr 280px;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .game-container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        #canvas-container {
            position: relative;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            height: 460px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .tools {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tools button {
            background: #2f3640;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tools button.active-tool {
            background: var(--text-color);
            box-shadow: 0 0 15px var(--text-color);
        }

        input, button.main-btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input { 
            width: calc(100% - 24px); 
            background: #2f3640; 
            color: #fff; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        button.main-btn { 
            background: var(--text-color); 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
        }

        .chat-messages {
            height: 310px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .system-msg { color: #fbc531; font-style: italic; }
        .correct-msg { color: #00ff88; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,136,0.3); }
        
        .player-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
        }

        #word-setup-zone {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="lobby" class="active">
        <h1 style="text-align: center; color: var(--text-color); font-size: 36px; text-shadow: 0 0 15px rgba(255,0,85,0.3);">Gartic Ultra Edition</h1>
        <div class="panel" style="max-width: 400px; margin: 0 auto; text-align: center;">
            <p style="color: #8d99ae;">добрий день бляха введи ник :</p>
            <input type="text" id="username" placeholder="Ваш ник..." maxlength="15">
            <button class="main-btn" onclick="joinGame()" style="width: 100%; margin-top: 15px;">Войти в говно </button>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game">
        <div id="status-line" class="drawer-status">Ожидание начала раунда...</div>

        <div class="game-container">
            <!-- Список игроков -->
            <div class="panel">
                <h3 style="color: var(--neon-blue); margin-top: 0;">Игроки в комнате</h3>
                <div id="players-list"></div>
                <div id="round-number" style="margin-top: 25px; font-weight: bold; color: #8d99ae;">Раунд: 1/3</div>
                <button class="main-btn" id="start-round-btn" onclick="forceStartRound()" style="width: 100%; margin-top: 15px; font-size: 14px; background: #00ff88; color: #000; display: none;">Запустить 1 раунд</button>
            </div>

            <!-- Холст для рисования -->
            <div id="canvas-container">
                <canvas id="paintCanvas" width="500" height="460"></canvas>
                <div class="tools" id="drawer-tools" style="display: none;">
                    <button id="tool-pencil" class="active-tool" onclick="setTool('pencil')">✏️ Карандаш</button>
                    <button id="tool-spray" onclick="setTool('spray')">💨 Баллончик</button>
                    <button onclick="clearCanvas()" style="background: #ea2027;">🗑️ Очистить</button>
                </div>
            </div>

            <!-- Чат -->
            <div class="panel" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <h3 id="panel-right-title" style="color: #fbc531; margin-top: 0;">Ответы / Чат</h3>
                    <div id="chat" class="chat-messages"></div>
                </div>
                
                <!-- Меню Загадывания -->
                <div id="word-setup-zone" style="display: none;">
                    <input type="text" id="secret-word-input" placeholder="Какое слово загадать?">
                    <button class="main-btn" onclick="submitSecretWord()">Загадать слово</button>
                </div>

                <!-- Меню Ответа -->
                <div id="guess-zone" style="display: none;">
                    <input type="text" id="guess-input" placeholder="Введите слово..." onkeypress="handleChatKey(event)">
                    <button class="main-btn" onclick="sendGuess()" style="width: 100%; margin-top: 8px;">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ТВОЙ КОНФИГ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://gartic-game-default-rtdb.firebaseio.com",
            projectId: "gartic-game",
            storageBucket: "gartic-game.firebasestorage.app",
            messagingSenderId: "990895566694",
            appId: "1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = '';
        let myName = '';
        let currentRole = 'guesser'; 
        let currentTool = 'pencil'; 
        let isDrawing = false;

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        function joinGame() {
            const inputField = document.getElementById('username');
            const enteredName = inputField.value.trim();
            if(!enteredName) return alert('Введите никнейм!');
            
            myName = enteredName;
            myId = '_' + Math.random().toString(36).substr(2, 9);

            db.ref('players/' + myId).set({
                name: myName,
                score: 0,
                id: myId
            });

            db.ref('players/' + myId).onDisconnect().remove();

            document.getElementById('lobby').classList.remove('active');
            document.getElementById('game').classList.add('active');

            initGameSync();
        }

        function initGameSync() {
            // Исправленная проверка игроков
            db.ref('players').on('value', snapshot => {
                const playersObj = snapshot.val() || {};
                const listDiv = document.getElementById('players-list');
                listDiv.innerHTML = '';
                
                const playersArray = Object.values(playersObj);
                playersArray.forEach(p => {
                    listDiv.innerHTML += `<div class="player-item"><span>👤 <b>${p.name}</b></span> <span style="color:#00ff88">${p.score} б.</span></div>`;
                });

                db.ref('gameState/status').once('value', statusSnap => {
                    const startBtn = document.getElementById('start-round-btn');
                    if (!statusSnap.val() || statusSnap.val() === 'waiting') {
                        // ПРОВЕРКА ИСПРАВЛЕНА: ищем первый элемент массива корректно
                        if (playersArray.length > 0 && playersArray[0].id === myId) {
                            startBtn.style.display = 'block';
                        } else {
                            startBtn.style.display = 'none';
                        }
                    } else {
                        startBtn.style.display = 'none';
                    }
                });
            });

            db.ref('gameState').on('value', snapshot => {
                const state = snapshot.val();
                if (!state) {
                    document.getElementById('status-line').innerText = `Ожидание запуска игры главным игроком...`;
                    return;
                }

                document.getElementById('round-number').innerText = `Раунд: ${state.currentRound}/3`;

                if (state.drawerId === myId) {
                    currentRole = 'drawer';
                    canvas.style.pointerEvents = 'auto';
                    
                    if (state.status === 'setup') {
                        document.getElementById('status-line').innerHTML = `ЗАГАДАЙТЕ СЛОВО И НАЖМИТЕ КНОПКУ!`;
                        document.getElementById('word-setup-zone').style.display = 'flex';
                        document.getElementById('drawer-tools').style.display = 'none';
                        document.getElementById('guess-zone').style.display = 'none';
                    } else if (state.status === 'drawing') {
                        document.getElementById('status-line').innerHTML = `🎨 ВАШ ХОД! Рисуйте слово: <span style="color:#fff; text-decoration: underline;">${state.currentWord.toUpperCase()}</span>`;
                        document.getElementById('word-setup-zone').style.display = 'none';
                        document.getElementById('drawer-tools').style.display = 'flex';
                        document.getElementById('guess-zone').style.display = 'none';
                    }
                } else {
                    currentRole = 'guesser';
                    canvas.style.pointerEvents = 'none';
                    document.getElementById('word-setup-zone').style.display = 'none';
                    document.getElementById('drawer-tools').style.display = 'none';
                    document.getElementById('guess-zone').style.display = 'block';

                    if (state.status === 'setup') {
                        document.getElementById('status-line').innerText = `🤔 Кто-то загадывает слово...`;
                    } else if (state.status === 'drawing') {
                        document.getElementById('status-line').innerText = `🤔 Угадайте, что рисуют на экране!`;
                    }
                }
            });

            db.ref('canvas/lines').on('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                if (currentRole === 'guesser') {
                    drawFromFirebase(data.x, data.y, data.type, data.isNew);
                }
            });

            db.ref('chat').on('child_added', snapshot => {
                const msg = snapshot.val();
                const chatDiv = document.getElementById('chat');
                let className = '';
                if(msg.type === 'system') className = 'system-msg';
                if(msg.type === 'correct') className = 'correct-msg';

                chatDiv.innerHTML += `<div class="${className}"><b>${msg.user}:</b> ${msg.text}</div>`;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            });
        }

        function forceStartRound() {
            db.ref('players').once('value', snapshot => {
                const arr = Object.values(snapshot.val() || {});
                if(arr.length > 0) {
                    setupNewTurn(1, arr);
                }
            });
        }

        function setupNewTurn(roundNum, playersArray) {
            if (!playersArray || playersArray.length === 0) return;
            if (roundNum > 3) {
                showFinalResults();
                return;
            }

            const drawerIndex = (roundNum - 1) % playersArray.length;
            const drawer = playersArray[drawerIndex];

            db.ref('canvas').remove();
            db.ref('chat').remove();

            db.ref('gameState').set({
                status: 'setup',
                currentRound: roundNum,
                drawerId: drawer.id,
                currentWord: ''
            });

            sendSystemMessage(`Раунд ${roundNum} начался!`);
        }

        function submitSecretWord() {
            const input = document.getElementById('secret-word-input');
            const word = input.value.trim().toLowerCase();
            if (!word) return alert('Введите слово!');

            db.ref('gameState').update({
                status: 'drawing',
                currentWord: word
            });
            input.value = '';
        }

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('tool-pencil').classList.toggle('active-tool', tool === 'pencil');
            document.getElementById('tool-spray').classList.toggle('active-tool', tool === 'spray');
        }

        canvas.addEventListener('mousedown', (e) => {
            if (currentRole !== 'drawer') return;
            isDrawing = true;
            sendDrawData(e, true);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || currentRole !== 'drawer') return;
            sendDrawData(e, false);
        });
        window.addEventListener('mouseup', () => isDrawing = false);

        function sendDrawData(e, isNew) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            db.ref('canvas/lines').set({ x: x, y: y, type: currentTool, isNew: isNew });
            drawFromFirebase(x, y, currentTool, isNew);
        }

        let lastX, lastY;
        function drawFromFirebase(x, y, type, isNew) {
            if (isNew) { lastX = x; lastY = y; }
            if (type === 'pencil') {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else if (type === 'spray') {
                ctx.fillStyle = '#000000';
                for (let i = 0; i < 12; i++) {
                    const radius = 10;
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * radius;
                    ctx.fillRect(x + Math.cos(angle) * r, y + Math.sin(angle) * r, 2, 2);
                }
            }
            lastX = x; lastY = y;
        }

        function clearCanvas() {
            if (currentRole !== 'drawer') return;
            db.ref('canvas').remove();
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendGuess(); }

        function sendGuess() {
            const input = document.getElementById('guess-input');
            const text = input.value.trim().toLowerCase();
            if (!text) return;

            db.ref('gameState/currentWord').once('value', snapshot => {
                const correctWord = snapshot.val() || '';
                if (text === correctWord && correctWord !== '') {
                    db.ref(`players/${myId}/score`).transaction(score => (score || 0) + 1);
                    db.ref('chat').push({ user: 'Система', text: `🎉 ${myName} угадал слово (${correctWord})!`, type: 'correct' });
                    
                    db.ref('players').once('value', pSnap => {
                        const arr = Object.values(pSnap.val() || {});
                        db.ref('gameState/currentRound').once('value', rSnap => {
                            setupNewTurn(rSnap.val() + 1, arr);
                        });
                    });
                } else {
                    db.ref('chat').push({ user: myName, text: text, type: 'normal' });
                }
            });
            input.value = '';
        }

        function sendSystemMessage(text) {
            db.ref('chat').push({ user: 'Система', text: text, type: 'system' });
        }

        function showFinalResults() {
            db.ref('players').once('value', snapshot => {
                const players = Object.values(snapshot.val() || {});
                players.sort((a,b) => b.score - a.score);
                let text = '🏆 ИТОГИ ИГРЫ:\n';
                players.forEach((p, i) => { text += `${i + 1}. ${p.name} — ${p.score} очков\n`; });
                alert(text);
                db.ref('gameState').remove();
            });
        }
    </script>
</body>
</html>
