<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Gartic Room</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:#020617;
    color:white;
}

/* BACKGROUND PARTICLES */
#bg{
    position:fixed;
    inset:0;
    z-index:-3;
}

/* GLASS TRANSITION */
#glass{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    opacity:0;
    pointer-events:none;
    transition:1.2s;
}
#glass.active{
    opacity:1;
}

/* MENU */
#menu{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:320px;
    padding:25px;
    border-radius:20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:none;
}

button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    border:none;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

/* GAME */
#game{display:none;}

#top{
    height:60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    background:rgba(0,0,0,0.4);
}

#main{
    display:flex;
    height:calc(100vh - 60px);
}

#players{
    width:200px;
    background:rgba(0,0,0,0.3);
    padding:10px;
}

#center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

canvas{
    background:white;
    border-radius:12px;
    cursor:crosshair;
}

#chat{
    width:260px;
    background:rgba(0,0,0,0.3);
    padding:10px;
}

/* PARTICLES */
.dot{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:radial-gradient(circle,red,orange,yellow,green,blue,purple);
    animation:float 2s linear infinite;
}

@keyframes float{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-250px);opacity:0;}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div id="glass"></div>

<!-- MENU -->
<div id="menu">
    <div class="box" id="box">
        <h2>🌈 Neon Gartic</h2>
        <input id="nick" placeholder="Ник">
        <button onclick="join()">Войти</button>
    </div>
</div>

<!-- GAME -->
<div id="game">

    <div id="top">
        <div id="role">...</div>
        <button onclick="startGame()">СТАРТ (любой)</button>
    </div>

    <div id="main">

        <div id="players"></div>

        <div id="center">
            <canvas id="c" width="650" height="420"></canvas>
        </div>

        <div id="chat"></div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

/* FIREBASE */
firebase.initializeApp({
apiKey:"AIzaSyCCceb4SmnsMryV7LQopTzPAhwV8yrxovU",
authDomain:"gartic-game.firebaseapp.com",
databaseURL:"https://gartic-game-default-rtdb.firebaseio.com",
projectId:"gartic-game",
storageBucket:"gartic-game.firebasestorage.app",
messagingSenderId:"990895566694",
appId:"1:990895566694:web:21b41bb6bcccc8c3e0a2a7"
});

const db=firebase.database();

/* ROOM SYSTEM (NEW PLAYERS ONLY) */
const roomId = "room_" + Math.random().toString(36).substr(2,6);

/* STATE */
let myId="";
let myName="";

/* BACKGROUND PARTICLES (RAINBOW) */
const bg=document.getElementById("bg");
const ctx=bg.getContext("2d");

bg.width=innerWidth;
bg.height=innerHeight;

let dots=[];

for(let i=0;i<120;i++){
    dots.push({
        x:Math.random()*bg.width,
        y:Math.random()*bg.height,
        vx:(Math.random()-0.5)*1.2,
        vy:(Math.random()-0.5)*1.2
    });
}

let mouse={x:0,y:0};

document.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
});

function animate(){
    ctx.clearRect(0,0,bg.width,bg.height);

    for(let d of dots){

        d.x+=d.vx;
        d.y+=d.vy;

        if(d.x<0||d.x>bg.width) d.vx*=-1;
        if(d.y<0||d.y>bg.height) d.vy*=-1;

        ctx.fillStyle="hsl("+(d.x%360)+",100%,60%)";
        ctx.beginPath();
        ctx.arc(d.x,d.y,2,0,Math.PI*2);
        ctx.fill();

        let dx=d.x-mouse.x;
        let dy=d.y-mouse.y;
        let dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<130){
            ctx.strokeStyle="rgba(255,255,255,0.15)";
            ctx.beginPath();
            ctx.moveTo(d.x,d.y);
            ctx.lineTo(mouse.x,mouse.y);
            ctx.stroke();
        }
    }

    requestAnimationFrame(animate);
}
animate();

/* JOIN PARTICLES */
function spawnRainbow(){
    let box=document.getElementById("box");

    for(let i=0;i<25;i++){
        let d=document.createElement("div");
        d.className="dot";
        d.style.left=Math.random()*300+"px";
        d.style.top="200px";
        box.appendChild(d);
        setTimeout(()=>d.remove(),2000);
    }
}

/* JOIN */
function join(){

    spawnRainbow();

    document.getElementById("glass").classList.add("active");

    setTimeout(()=>{

        myName=document.getElementById("nick").value;

        myId=db.ref("rooms/"+roomId+"/players").push().key;

        db.ref("rooms/"+roomId+"/players/"+myId).set({
            name:myName,
            score:0
        });

        document.getElementById("menu").style.display="none";
        document.getElementById("game").style.display="block";

        listen();

    },1200);
}

/* LISTEN */
function listen(){

    db.ref("rooms/"+roomId+"/players").on("value",snap=>{
        let p=snap.val()||{};
        document.getElementById("players").innerHTML=
        Object.values(p).map(x=>"👤 "+x.name).join("<br>");
    });

    db.ref("rooms/"+roomId+"/chat").on("child_added",snap=>{
        let m=snap.val();
        document.getElementById("chat").innerHTML+=
        `<div>${m.user}: ${m.text}</div>`;
    });

}

/* START GAME (ANYONE CAN START) */
function startGame(){

    db.ref("rooms/"+roomId).set({
        started:true,
        word:""
    });

    db.ref("rooms/"+roomId+"/chat").push({
        user:"SYSTEM",
        text:"🎮 Новая игра началась"
    });

}

/* DRAW */
const c=document.getElementById("c");
const cctx=c.getContext("2d");

let draw=false;

c.addEventListener("mousedown",()=>draw=true);
c.addEventListener("mouseup",()=>draw=false);

c.addEventListener("mousemove",e=>{
    if(!draw)return;

    let r=c.getBoundingClientRect();

    let x=e.clientX-r.left;
    let y=e.clientY-r.top;

    cctx.fillStyle="black";
    cctx.fillRect(x,y,3,3);
});

</script>

</body>
</html>
